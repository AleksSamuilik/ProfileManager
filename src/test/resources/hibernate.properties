# Тестовая конфигурация: подменяет main/resources/hibernate.properties (test-classpath идёт первым).
# In-memory H2 в режиме PostgreSQL: Docker и установленный PostgreSQL не нужны.
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:mem:profilemanager_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
hibernate.connection.username=sa
hibernate.connection.password=

hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=create-drop
hibernate.show_sql=false
