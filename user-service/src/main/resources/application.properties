spring.config.import=optional:file:.env[.properties]
spring.application.name=profilemanager

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/profilemanager
spring.datasource.username=postgres
spring.datasource.password=${PROFILEMANAGER_DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.topic.user-events=user-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# ?? ????????? ? ????????? ??? Java-??????: consumer ????? ? ?????? ??????? ?? ????? ??????? UserEvent
spring.kafka.producer.properties.spring.json.add.type.headers=false
